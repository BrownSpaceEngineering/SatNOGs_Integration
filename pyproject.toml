[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "satnogs-integration"
version = "1.0.0"
description = "PVDX cloud telemetry"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
    "satnogs-decoders>=1.100",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
satnogs-integration = "satnogs_integration.__main__:main"

[tool.setuptools.packages.find]
include = ["satnogs_integration*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
